<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungPhan.NetWork - Đăng nhập Google</title>
  <!-- Thư viện Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    /* Thanh điều hướng giống bản vẽ phác thảo */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 2px solid #222;
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: bold;
      font-size: 18px;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    /* Khu vực hiển thị Avatar sau khi đăng nhập */
    #user-profile {
      display: none;
      align-items: center;
      gap: 8px;
    }
    #user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 2px solid #333;
      object-fit: cover;
    }
    .btn-logout {
      padding: 5px 10px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Thanh điều hướng -->
  <nav class="navbar">
    <div class="nav-left">
      <span>☰</span>
      <span>🍪 HungPhan.NetWork</span>
    </div>

    <div class="nav-right">
      <!-- Nút Đăng nhập Google (hiện khi chưa đăng nhập) -->
      <div id="g_id_onload"
           data-client_id="547859183476-gpq3i828j6dqjrsu1tg2l24ntir76o3m.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div id="google-login-btn" class="g_id_signin"
           data-type="icon"
           data-shape="circle"
           data-theme="outline"
           data-size="large">
      </div>

      <!-- Thông tin Avatar + Tên (hiện sau khi đăng nhập) -->
      <div id="user-profile">
        <span id="user-name" style="font-size: 14px; font-weight: 600;"></span>
        <img id="user-avatar" src="" alt="Avatar">
        <button class="btn-logout" onclick="logoutGoogle()">Thoát</button>
      </div>
    </div>
  </nav>

  <script>
    // Giải mã thông tin tài khoản từ token Google trả về
    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    // Xử lý khi đăng nhập thành công
    function handleCredentialResponse(response) {
      const userData = parseJwt(response.credential);
      
      // Lưu vào trình duyệt để F5 không bị mất đăng nhập
      localStorage.setItem('hp_user', JSON.stringify({
        name: userData.name,
        email: userData.email,
        picture: userData.picture
      }));

      renderUserUI(userData);
    }

    // Cập nhật giao diện thanh Navbar
    function renderUserUI(user) {
      document.getElementById('google-login-btn').style.display = 'none';
      document.getElementById('user-profile').style.display = 'flex';
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-avatar').src = user.picture;
    }

    // Đăng xuất
    function logoutGoogle() {
      localStorage.removeItem('hp_user');
      document.getElementById('user-profile').style.display = 'none';
      document.getElementById('google-login-btn').style.display = 'block';
    }

    // Tự động kiểm tra trạng thái đăng nhập khi tải lại trang
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('hp_user');
      if (savedUser) {
        renderUserUI(JSON.parse(savedUser));
      }
    });
  </script>

</body>
</html>
