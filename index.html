<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HungPhan.NetWork</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg-page: #ffffff;
      --bg-card: #ffffff;
      --bg-notice: #f5f5f5;
      --text-main: #111111;
      --text-muted: #555555;
      --border-main: #181818;
      --border-soft: #cccccc;
      --btn-bg: #ffffff;
      --btn-hover: #efefef;
    }

    body.dark-mode {
      --bg-page: #121212;
      --bg-card: #1c1c1e;
      --bg-notice: #242426;
      --text-main: #f5f5f5;
      --text-muted: #b0b0b5;
      --border-main: #e5e5e5;
      --border-soft: #3a3a3c;
      --btn-bg: #2c2c2e;
      --btn-hover: #3a3a3c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    /* Thanh điều hướng trên cùng */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 3px solid var(--border-main);
      position: sticky;
      top: 0;
      background-color: var(--bg-page);
      z-index: 50;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 20px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      border-radius: 8px;
    }

    .icon-btn:hover {
      background-color: var(--btn-hover);
    }

    .cookie-logo {
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
    }

    .cookie-sub {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text-muted);
      margin-top: -2px;
    }

    /* Khu vực Avatar & Đăng nhập Google */
    #user-profile {
      display: none;
      align-items: center;
      gap: 6px;
    }

    #user-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 2px solid var(--border-main);
      object-fit: cover;
    }

    .btn-logout {
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      border: 1.5px solid var(--border-main);
      border-radius: 999px;
      background: var(--btn-bg);
      color: var(--text-main);
      cursor: pointer;
    }

    /* Nội dung chính */
    .container {
      flex: 1;
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .photo-box {
      width: 58px;
      height: 44px;
      border: 2px solid var(--border-main);
      border-radius: 6px;
      background-color: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
      flex-shrink: 0;
      overflow: hidden;
    }

    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-box {
      flex: 1;
      min-height: 44px;
      border: 2px solid var(--border-main);
      border-radius: 10px;
      background-color: var(--bg-card);
      padding: 6px 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      line-height: 1.25;
      overflow: hidden;
    }

    .info-sub {
      font-size: 11px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .action-btn {
      width: 48px;
      height: 44px;
      border: 2px solid var(--border-main);
      border-radius: 8px;
      background-color: var(--btn-bg);
      color: var(--text-main);
      font-size: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .action-btn:hover {
      background-color: var(--btn-hover);
    }

    /* Thanh thông báo phía dưới */
    .notice-bar {
      width: 100%;
      max-width: 520px;
      margin: 0 auto 18px;
      padding: 10px 14px;
      border: 2px solid var(--border-main);
      border-radius: 999px;
      background-color: var(--bg-notice);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 600;
    }

    .notice-icon {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border-main);
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* Toast phản hồi khi bấm nút */
    #toast {
      position: fixed;
      bottom: 72px;
      left: 50%;
      transform: translateX(-50%);
      background-color: var(--border-main);
      color: var(--bg-page);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 100;
    }

    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Thanh điều hướng trên cùng -->
  <nav class="navbar">
    <div class="nav-left">
      <button class="icon-btn" onclick="showToast('Mở menu điều hướng')" title="Menu">☰</button>
      <div class="cookie-logo" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" title="Trang chủ">
        <span>🍪</span>
        <span class="cookie-sub">Icon</span>
      </div>
      <button class="icon-btn" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })" title="Trang chủ">🏠</button>
      <button class="icon-btn" onclick="showToast('Tính năng tìm kiếm đang cập nhật')" title="Tìm kiếm">🔍</button>
    </div>

    <div class="nav-right">
      <button class="icon-btn" onclick="showToast('Cài đặt giao diện')" title="Cài đặt">⚙️</button>
      <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Đổi giao diện">🌙</button>

      <!-- Nút Đăng nhập Google -->
      <div id="g_id_onload"
           data-client_id="547859183476-gpq3i828j6dqjrsu1tg2l24ntir76o3m.apps.googleusercontent.com"
           data-callback="handleCredentialResponse"
           data-auto_prompt="false">
      </div>
      <div id="google-login-btn" class="g_id_signin"
           data-type="icon"
           data-shape="circle"
           data-theme="outline"
           data-size="medium">
      </div>

      <!-- Khung Avatar sau khi đăng nhập -->
      <div id="user-profile">
        <span id="user-name" style="font-size: 12px; font-weight: 700;"></span>
        <img id="user-avatar" src="" alt="Ava">
        <button class="btn-logout" onclick="logoutGoogle()">Thoát</button>
      </div>
    </div>
  </nav>

  <!-- Danh sách các thẻ theo bản vẽ -->
  <main class="container">
    <!-- Thẻ 1: IP Server + Copy -->
    <div class="card-row">
      <div class="photo-box">Photo</div>
      <div class="info-box">
        <span id="server-ip-text">HungPhan.NetWork</span>
        <span class="info-sub">PC 1.12 - PE 26.0 - 26.60</span>
      </div>
      <button class="action-btn" onclick="copyServerIP()">
        <span>📋</span>
        <span>Copy</span>
      </button>
    </div>

    <!-- Thẻ 2: TEAM Bettamos Creation ? + Zoom -->
    <div class="card-row">
      <div class="photo-box">Photo</div>
      <div class="info-box">
        <span>TEAM Bettamos Creation ?</span>
      </div>
      <button class="action-btn" onclick="showToast('Xem chi tiết TEAM Bettamos Creation')">
        <span>🔍</span>
        <span>Zoom</span>
      </button>
    </div>

    <!-- Thẻ 3: Group Bettamos Veri... 2F8A + Join -->
    <div class="card-row">
      <div class="photo-box">Photo</div>
      <div class="info-box">
        <span>Group Bettamos Veri... 2F8A</span>
      </div>
      <button class="action-btn" onclick="showToast('Đang mở liên kết tham gia Group Bettamos')">
        <span>→GO</span>
        <span>Join</span>
      </button>
    </div>

    <!-- Thẻ 4: Khung trống chờ bổ sung -->
    <div class="card-row">
      <div class="photo-box">Photo</div>
      <div class="info-box"></div>
    </div>
  </main>

  <!-- Thanh thông báo phía dưới -->
  <div class="notice-bar" id="notice-bar">
    <span class="notice-icon">!</span>
    <span id="notice-text">Chào mừng bạn đến với HungPhan.NetWork</span>
  </div>

  <div id="toast"></div>

  <script>
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('show');
      }, 2200);
    }

    function copyServerIP() {
      const ipText = document.getElementById('server-ip-text').textContent.trim();
      navigator.clipboard.writeText(ipText).then(() => {
        showToast('Đã sao chép: ' + ipText);
      }).catch(() => {
        showToast('IP: ' + ipText);
      });
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-mode');
      const isDark = document.body.classList.contains('dark-mode');
      document.getElementById('theme-toggle').textContent = isDark ? '☀️' : '🌙';
      localStorage.setItem('hp_theme', isDark ? 'dark' : 'light');
    }

    function parseJwt(token) {
      const base64Url = token.split('.')[1];
      const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
      const jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
      }).join(''));
      return JSON.parse(jsonPayload);
    }

    function handleCredentialResponse(response) {
      const userData = parseJwt(response.credential);
      const userInfo = {
        name: userData.name,
        email: userData.email,
        picture: userData.picture
      };
      localStorage.setItem('hp_user', JSON.stringify(userInfo));
      renderUserUI(userInfo);
      showToast('Xin chào ' + userInfo.name + '!');
    }

    function renderUserUI(user) {
      document.getElementById('google-login-btn').style.display = 'none';
      document.getElementById('user-profile').style.display = 'flex';
      document.getElementById('user-name').textContent = user.name;
      document.getElementById('user-avatar').src = user.picture;
      document.getElementById('notice-text').textContent = 'Đang đăng nhập: ' + user.email;
    }

    function logoutGoogle() {
      localStorage.removeItem('hp_user');
      document.getElementById('user-profile').style.display = 'none';
      document.getElementById('google-login-btn').style.display = 'block';
      document.getElementById('notice-text').textContent = 'Chào mừng bạn đến với HungPhan.NetWork';
      showToast('Đã đăng xuất');
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (localStorage.getItem('hp_theme') === 'dark') {
        document.body.classList.add('dark-mode');
        document.getElementById('theme-toggle').textContent = '☀️';
      }
      const savedUser = localStorage.getItem('hp_user');
      if (savedUser) {
        renderUserUI(JSON.parse(savedUser));
      }
    });
  </script>
</body>
</html>
